<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOF Union</title>
    <style>
        /* Base Theme Variables */
        :root {
            /* Light Theme: Bureaucratic Paperwork */
            --bg-primary: #e6dfd3;
            --bg-secondary: #dcd4c4;
            --text-primary: #2b2b2b;
            --text-muted: #5a5449;
            --accent-red: #b8261e;
            --accent-gold: #cd9a24;
            --border-color: #7a7365;
            --font-family: 'Courier New', Courier, monospace;
        }

        [data-theme="dark"] {
            /* Dark Theme: Iron Curtain / Industrial Night */
            --bg-primary: #1c1d1f;
            --bg-secondary: #2b2d31;
            --text-primary: #e0e0e0;
            --text-muted: #a0a5ad;
            --accent-red: #cc1111;
            --accent-gold: #ffcc00;
            --border-color: #4a4d52;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Flex container for the whole screen layout */
        .tab-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        /* The main tab navigation bar */
        .tab-menu {
            display: flex;
            background-color: var(--bg-secondary);
            border-bottom: 3px double var(--border-color);
            height: 60px;
            padding-right: 120px; /* Leaves perfect empty space on the right for the fixed tab */
        }

        /* Normal menu tab buttons */
        .tab-button {
            flex: 1;
            border: none;
            outline: none;
            cursor: pointer;
            background-color: inherit;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-muted);
            font-family: var(--font-family);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s, color 0.2s;
        }

        .tab-button:hover {
            background-color: var(--bg-primary);
            color: var(--accent-red);
        }

        .tab-button.active {
            background-color: var(--bg-primary);
            color: var(--accent-red);
            border-bottom: 4px solid var(--accent-red);
        }

        /* Persistent corner tab: Locks into top-right layout grid */
        .corner-settings-tab {
            position: fixed;
            top: 0;
            right: 0;
            width: 120px;
            height: 60px; /* Matches the top menu height exactly */
            border: none;
            border-left: 2px solid var(--border-color);
            border-bottom: 3px double var(--border-color);
            background-color: var(--accent-red);
            color: var(--accent-gold);
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font-family);
            text-transform: uppercase;
            cursor: pointer;
            z-index: 1000; /* Stays locked on top layer */
            transition: all 0.2s ease;
        }

        .corner-settings-tab:hover {
            background-color: var(--text-primary);
            color: var(--bg-primary);
        }

        /* Active styling when the settings view is open */
        .corner-settings-tab.active {
            background-color: var(--bg-primary);
            color: var(--accent-gold);
            border-bottom: 4px solid var(--accent-gold);
        }

        /* Content panels */
        .tab-panel {
            display: none;
            flex: 1;
            padding: 40px;
            background-color: var(--bg-primary);
            overflow-y: auto; /* Internal scrolling if panel content gets long */
            animation: fadeIn 0.3s ease-in-out;
        }

        .tab-panel.active {
            display: block;
        }

        .tab-panel h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .tab-panel p {
            font-size: 18px;
            line-height: 1.6;
            color: var(--text-primary);
        }

        /* Settings UI Styling */
        fieldset {
            border: 2px dashed var(--border-color);
            padding: 20px;
            max-width: 400px;
            background-color: var(--bg-secondary);
        }

        legend {
            padding: 0 10px;
            color: var(--accent-gold);
            font-weight: bold;
            text-transform: uppercase;
        }

        label {
            font-size: 16px;
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            font-family: var(--font-family);
            font-size: 16px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            outline: none;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
<div class="tab-container">

    <div class="tab-menu">
        <button class="tab-button active" onclick="switchTab(event,'dashboard')">★ SCOF INFO</button>
        <button class="tab-button" onclick="switchTab(event,'analytics')">★ BRANCHES</button>
        <button class="tab-button" onclick="switchTab(event,'settings')">★ MEMBERS</button>
        <button class="tab-button" onclick="switchTab(event,'GEA')">★ G.E.A.</button>
    </div>

    <button id="settings-tab-btn" class="corner-settings-tab" onclick="switchTab(event, 'settings2')">
        ⚙️ Settings
    </button>

    <div id="dashboard" class="tab-panel active">
        <h2>SCOF info</h2>
        <p>SCOF stands for Socialism, Communism, Oligarchy, and Federalism.</p>
    </div>

    <div id="analytics" class="tab-panel">
        <h2>SCOF branches</h2>
        <p>This is where the state branches go.</p>
    </div>

    <div id="GEA" class="tab-panel">
        <h2>GOVERNED ENTREPRENEURSHIP APPLICATIONS</h2>
        <p>pending</p>
    </div>

    <!-- FIXED TYPO: Changed class="tab-panal" to class="tab-panel" -->
    <div id="settings" class="tab-panel">
        <h2>SCOF MEMBERS</h2>
        <p>This is where the members registry will be kept.</p>
    </div>

    <div id="settings2" class="tab-panel">
        <h2>Union Control Settings</h2>
        <fieldset>
            <legend>Interface Parameters</legend>
            <label for="theme">Theme Mode:</label>
            <select id="theme" name="theme" onchange="changeTheme(this.value)">
                <option value="light">Light Mode (Bureaucracy)</option>
                <option value="dark">Dark Mode (Iron Curtain)</option>
            </select>
        </fieldset>
    </div>
</div>

<script>
    function switchTab(event, tabId) {
        // 1. Hide all text panels
        const panels = document.querySelectorAll('.tab-panel');
        panels.forEach(panel => panel.classList.remove('active'));

        // 2. Remove active state styling from regular top buttons
        const buttons = document.querySelectorAll('.tab-button');
        buttons.forEach(button => button.classList.remove('active'));

        // 3. Remove active state styling from the custom corner settings tab
        document.getElementById('settings-tab-btn').classList.remove('active');

        // 4. Reveal the target clicked content layout panel area
        const targetPanel = document.getElementById(tabId);
        if (targetPanel) {
            targetPanel.classList.add('active');
        }

        // 5. Highlight the exact button that triggered the action
        event.currentTarget.classList.add('active');
    }

    // Active theme engine
    function changeTheme(themeValue) {
        document.documentElement.setAttribute('data-theme', themeValue);
        localStorage.setItem('scof-theme', themeValue);
        document.getElementById('theme').value = themeValue;
    }

    // Auto load saved theme settings on startup
    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('scof-theme') || 'light';
        changeTheme(savedTheme);
    });
</script>
</body>
</html>
